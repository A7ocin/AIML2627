<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 420" role="img" aria-label="Four roles in learning: study material, learner, teacher and assessment."><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#eaf2fb}.teal{fill:#45d6c0}.muted{fill:#b6c6d8}</style><g transform="translate(0,30)"><rect width="375" height="350" rx="22" fill="#142432" stroke="#40556e"/><text x="28" y="55" font-size="28" class="teal">01</text><text x="28" y="125" font-size="36" font-weight="700">Study material</text><text x="28" y="200" font-size="27" class="muted">Worked questions</text><text x="28" y="248" font-size="27" class="muted">and their solutions.</text></g><g transform="translate(395,30)"><rect width="375" height="350" rx="22" fill="#142432" stroke="#40556e"/><text x="28" y="55" font-size="28" class="teal">02</text><text x="28" y="125" font-size="36" font-weight="700">Learner</text><text x="28" y="200" font-size="27" class="muted">A student practices</text><text x="28" y="248" font-size="27" class="muted">and learns a method.</text></g><g transform="translate(790,30)"><rect width="375" height="350" rx="22" fill="#142432" stroke="#40556e"/><text x="28" y="55" font-size="28" class="teal">03</text><text x="28" y="125" font-size="36" font-weight="700">Teacher</text><text x="28" y="200" font-size="27" class="muted">Feedback helps the</text><text x="28" y="248" font-size="27" class="muted">student improve.</text></g><g transform="translate(1185,30)"><rect width="375" height="350" rx="22" fill="#142432" stroke="#40556e"/><text x="28" y="55" font-size="28" class="teal">04</text><text x="28" y="125" font-size="36" font-weight="700">Assessment</text><text x="28" y="200" font-size="27" class="muted">New questions check</text><text x="28" y="248" font-size="27" class="muted">what the student learned.</text></g></svg>