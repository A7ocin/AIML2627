<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 390" role="img"><style>text{font-family:Segoe UI,Arial,sans-serif}</style><text x="825" y="42" font-size="40" fill="#edf3fb" text-anchor="middle" font-weight="700">Variable</text><path d="M825 65L425 105" fill="none" stroke="#6ee1cf" stroke-width="4"/><path d="M825 65L1215 105" fill="none" stroke="#c6a4ed" stroke-width="4"/><text x="425" y="140" font-size="35" fill="#6ee1cf" text-anchor="middle" font-weight="700">Quantitative: magnitude</text><text x="1215" y="140" font-size="35" fill="#c6a4ed" text-anchor="middle" font-weight="700">Categorical: category</text><path d="M425 157L190.0 205" fill="none" stroke="#6ee1cf" stroke-width="3"/><rect x="50" y="205" width="280" height="150" rx="16" fill="#152638" stroke="#6ee1cf" stroke-width="2"/><text x="190.0" y="262" font-size="33" fill="#6ee1cf" text-anchor="middle" font-weight="700">Continuous</text><text x="190.0" y="315" font-size="27" fill="#edf3fb" text-anchor="middle" font-weight="400">yield in kg</text><path d="M425 157L510.0 205" fill="none" stroke="#6ee1cf" stroke-width="3"/><rect x="370" y="205" width="280" height="150" rx="16" fill="#152638" stroke="#6ee1cf" stroke-width="2"/><text x="510.0" y="262" font-size="33" fill="#6ee1cf" text-anchor="middle" font-weight="700">Discrete</text><text x="510.0" y="315" font-size="27" fill="#edf3fb" text-anchor="middle" font-weight="400">number of plants</text><path d="M1215 157L890.0 205" fill="none" stroke="#c6a4ed" stroke-width="3"/><rect x="760" y="205" width="260" height="150" rx="16" fill="#152638" stroke="#c6a4ed" stroke-width="2"/><text x="890.0" y="262" font-size="33" fill="#c6a4ed" text-anchor="middle" font-weight="700">Nominal</text><text x="890.0" y="315" font-size="27" fill="#edf3fb" text-anchor="middle" font-weight="400">species</text><path d="M1215 157L1180.0 205" fill="none" stroke="#c6a4ed" stroke-width="3"/><rect x="1050" y="205" width="260" height="150" rx="16" fill="#152638" stroke="#c6a4ed" stroke-width="2"/><text x="1180.0" y="262" font-size="33" fill="#c6a4ed" text-anchor="middle" font-weight="700">Ordinal</text><text x="1180.0" y="315" font-size="27" fill="#edf3fb" text-anchor="middle" font-weight="400">low, medium, high</text><path d="M1215 157L1470.0 205" fill="none" stroke="#c6a4ed" stroke-width="3"/><rect x="1340" y="205" width="260" height="150" rx="16" fill="#152638" stroke="#c6a4ed" stroke-width="2"/><text x="1470.0" y="262" font-size="33" fill="#c6a4ed" text-anchor="middle" font-weight="700">Binary</text><text x="1470.0" y="315" font-size="27" fill="#edf3fb" text-anchor="middle" font-weight="400">yes / no</text></svg>