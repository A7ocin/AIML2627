le cx="719.20" cy="230" r="13" fill="#6ee1cf"/><circle cx="780.00" cy="230" r="13" fill="#6ee1cf"/><circle cx="840.80" cy="230" r="13" fill="#6ee1cf"/><circle cx="901.60" cy="230" r="13" fill="#6ee1cf"/><text x="476.0" y="315" text-anchor="middle" font-size="29" fill="#edf3fb">Fit parameters</text></g><g data-split="validation" data-count="10"><rect x="962" y="15" width="304" height="345" rx="16" fill="#152638" stroke="#c6a4ed" stroke-width="2"/><text x="1114.0" y="72" text-anchor="middle" font-size="39" font-weight="700" fill="#c6a4ed">Validation</text><text x="1114.0" y="115" text-anchor="middle" font-size="29" fill="#d2deeb">20% (10 of 50)</text><circle cx="992.40" cy="175" r="13" fill="#c6a4ed"/><circle cx="1053.20" cy="175" r="13" fill="#c6a4ed"/><circle cx="1114.00" cy="175" r="13" fill="#c6a4ed"/><circle cx="1174.80" cy="175" r="13" fill="#c6a4ed"/><circle cx="1235.60" cy="175" r="13" fill="#c6a4ed"/><circle cx="992.40" cy="230" r="13" fill="#c6a4ed"/><circle cx="1053.20" cy="230" r="13" fill="#c6a4ed"/><circle cx="1114.00" cy="230" r="13" fill="#c6a4ed"/><circle cx="1174.80" cy="230" r="13" fill="#c6a4ed"/><circle cx="1235.60" cy="230" r="13" fill="#c6a4ed"/><text x="1114.0" y="315" text-anchor="middle" font-size="29" fill="#edf3fb">Compare models</text></g><g data-split="test" data-count="10"><rect x="1296" y="15" width="304" height="345" rx="16" fill="#152638" stroke="#ffd166" stroke-width="2"/><text x="1448.0" y="72" text-anchor="middle" font-size="39" font-weight="700" fill="#ffd166">Test</text><text x="1448.0" y="115" text-anchor="middle" font-size="29" fill="#d2deeb">20% (10 of 50)</text><circle cx="1326.40" cy="175" r="13" fill="#ffd166"/><circle cx="1387.20" cy="175" r="13" fill="#ffd166"/><circle cx="1448.00" cy="175" r="13" fill="#ffd166"/><circle cx="1508.80" cy="175" r="13" fill="#ffd166"/><circle cx="1569.60" cy="175" r="13" fill="#ffd166"/><circle cx="1326.40" cy="230" r="13" fill="#ffd166"/><circle cx="1387.20" cy="230" r="13" fill="#ffd166"/>