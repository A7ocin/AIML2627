<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img"><title>TSS, RSS and R-squared as squared-error bars</title><desc>The mean-only baseline has squared error TSS equal to 8. The model has squared error RSS equal to 2 on the same cases. It removes 6 of the baseline's 8 error units, so R-squared is 6 divided by 8, or 0.75.</desc><rect width="720" height="390" rx="14" fill="#0e1520"/><g font-family="Segoe UI, sans-serif" fill="#dce7f2"><text x="35" y="35" font-size="22">Squared error on the same observations</text><text x="35" y="77" font-size="23" fill="#4db8ff">Mean-only baseline · TSS = 8</text><rect x="40" y="92" width="600" height="40" rx="5" fill="#4db8ff"/><text x="35" y="202" font-size="23" fill="#c799ff">Our model · RSS = 2</text><rect x="40" y="216" width="150" height="40" rx="5" fill="#c799ff"/><g stroke="#3d4d64" stroke-width="2"><path d="M40 139 V151 M190 139 V151 M340 139 V151 M490 139 V151 M640 139 V151"/></g><g fill="#b5c6d7" font-size="19" text-anchor="middle"><text x="40" y="175">0</text><text x="190" y="175">2</text><text x="340" y="175">4</text><text x="490" y="175">6</text><text x="640" y="175">8</text></g><path d="M190 236 H640 M190 229 V243 M640 229 V243" fill="none" stroke="#45d6c0" stroke-width="3"/><text x="421" y="270" text-anchor="middle" font-size="22" fill="#45d6c0">6 units of squared error removed</text><rect x="34" y="291" width="652" height="87" rx="10" fill="#132b2b" stroke="#45d6c0"/><text x="360" y="325" text-anchor="middle" font-size="30" fill="#45d6c0">R² = (8 − 2) / 8 = 0.75</text><text x="360" y="358" text-anchor="middle" font-size="22">75% less squared error than the mean baseline</text></g></svg>