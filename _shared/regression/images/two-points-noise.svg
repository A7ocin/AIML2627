<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img"><title>Two observations can always be fitted perfectly by a line</title><desc>At two different inputs, a straight line goes through both observed points. RSS is zero, even though the observations might contain measurement noise.</desc><rect width="600" height="300" rx="12" fill="#0e1520"/><g fill="#b9c8d8" font-family="Segoe UI, sans-serif" font-size="19"><path d="M60 30 V235 H550" fill="none" stroke="#879aaf" stroke-width="2"/><text x="555" y="242">x</text><text x="28" y="35">y</text><path d="M85 232 L535 52" stroke="#45d6c0" stroke-width="4"/><circle cx="160" cy="202" r="8" fill="#4db8ff" stroke="#edf5ff" stroke-width="2"/><circle cx="460" cy="82" r="8" fill="#4db8ff" stroke="#edf5ff" stroke-width="2"/><text x="95" y="178">Observation 1</text><text x="365" y="57">Observation 2</text><text x="300" y="277" text-anchor="middle" fill="#45d6c0">Both residuals are 0 → RSS = 0</text></g></svg>