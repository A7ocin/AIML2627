<title id="title">An absurd study tip: giant shoes before an exam</title><desc id="desc">A cartoon student reads a book while wearing comically oversized red shoes. A speech bubble asks whether size 48 gives an instant A plus. This illustrates a mistaken causal conclusion.</desc>
