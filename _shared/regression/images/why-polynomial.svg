<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img"><title>A polynomial can follow a curved trend missed by a straight line</title><desc>The same nine toy observations form a U-shaped pattern. A straight-line fit runs across the middle. A quadratic fit follows the curved pattern closely.</desc><rect width="1400" height="440" rx="16" fill="#0e1520"/><g font-family="Segoe UI, sans-serif" font-size="24" fill="#b8cbdc"><g stroke="#253345" stroke-width="1"><path d="M95 105 H1280 M95 210 H1280 M95 315 H1280"/></g><path d="M95 45 V345 H1280" fill="none" stroke="#8198ad" stroke-width="2"/><text x="95" y="31">Response</text><text x="1295" y="353">Input</text><path d="M150 196.6667 H1150" fill="none" stroke="#a4b2c6" stroke-width="4" stroke-dasharray="14 9"/><path d="M150.0000 72.4242 Q650.0000 498.3983 1150.0000 72.4242" fill="none" stroke="#45d6c0" stroke-width="5"/><circle cx="150.0000" cy="70.0000" r="8" fill="#4db8ff" stroke="#e8f5ff" stroke-width="2"/><circle cx="275.0000" cy="172.5000" r="8" fill="#4db8ff" stroke="#e8f5ff" stroke-width="2"/><circle cx="400.0000" cy="225.0000" r="8" fill="#4db8ff" stroke="#e8f5ff" stroke-width="2"/><circle cx="525.0000" cy="277.5000" r="8" fill="#4db8ff" stroke="#e8f5ff" stroke-width="2"/><circle cx="650.0000" cy="280.0000" r="8" fill="#4db8ff" stroke="#e8f5ff" stroke-width="2"/><circle cx="775.0000" cy="277.5000" r="8" fill="#4db8ff" stroke="#e8f5ff" stroke-width="2"/><circle cx="900.0000" cy="225.0000" r="8" fill="#4db8ff" stroke="#e8f5ff" stroke-width="2"/><circle cx="1025.0000" cy="172.5000" r="8" fill="#4db8ff" stroke="#e8f5ff" stroke-width="2"/><circle cx="1150.0000" cy="70.0000" r="8" fill="#4db8ff" stroke="#e8f5ff" stroke-width="2"/><circle cx="190" cy="403" r="7" fill="#4db8ff"/><text x="210" y="411">Observed data</text><path d="M530 403 H585" stroke="#a4b2c6" stroke-width="4" stroke-dasharray="12 7"/><text x="600" y="411">Straight line</text><path d="M925 403 H980" stroke="#45d6c