<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" role="img"><title>Simplified Neocognitron hierarchy of S-cell and C-cell stages</title><rect width="680" height="460" rx="16" fill="#141a26"/><g font-family="Segoe UI,Arial,sans-serif"><text x="340" y="46" fill="#4db8ff" font-size="22" text-anchor="middle">FEATURES → TOLERANCE → RECOGNITION</text><rect x="98" y="84" width="484" height="80" rx="12" fill="#93a0b6" fill-opacity=".08" stroke="#93a0b6" stroke-width="2"/><text x="340" y="117" fill="#93a0b6" font-size="29" text-anchor="middle">Input</text><text x="340" y="147" fill="#e8ecf4" font-size="23" text-anchor="middle">Visual pattern</text><path d="M340 164 L340 199" stroke="#93a0b6" stroke-width="2" fill="none"/><rect x="98" y="199" width="484" height="80" rx="12" fill="#4db8ff" fill-opacity=".08" stroke="#4db8ff" stroke-width="2"/><text x="340" y="232" fill="#4db8ff" font-size="29" text-anchor="middle">S-cells</text><text x="340" y="262" fill="#e8ecf4" font-size="23" text-anchor="middle">Extract features</text><path d="M340 279 L340 314" stroke="#4db8ff" stroke-width="2" fill="none"/><rect x="98" y="314" width="484" height="80" rx="12" fill="#45d6c0" fill-opacity=".08" stroke="#45d6c0" stroke-width="2"/><text x="340" y="347" fill="#45d6c0" font-size="29" text-anchor="middle">C-cells</text><text x="340" y="377" fill="#e8ecf4" font-size="23" text-anchor="middle">Pool responses</text><text x="340" y="440" fill="#93a0b6" font-size="23" text-anchor="middle">Repeated S/C stages build a hierarchy</text></g></svg>